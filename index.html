<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Фото и Видео</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px 15px;
            background: #111827;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            margin-top: 25px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #6d28d9;
        }

        input {
            margin: 20px;
            padding: 12px;
            background: white;
            border-radius: 10px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 ИИ Фото и Видео</h1>
    <p>Создавай изображения и видео с помощью искусственного интеллекта</p>
</header>

<div class="container">

    <div class="card">
        <h2>🖼️ Оживить фотографию</h2>
        <p>Загрузи фотографию и создай из неё живое видео</p>

        <input type="file" accept="image/*">

        <br>

        <button onclick="alert('Функция ИИ скоро будет подключена!')">
            Оживить фото
        </button>
    </div>

    <div class="card">
        <h2>🎬 Создать видео</h2>
        <p>Создавай короткие видео с помощью ИИ</p>

        <button onclick="alert('Генератор видео скоро будет подключен!')">
            Создать видео
        </button>
    </div>

</div>

<footer>
    © 2026 ИИ Фото и Видео
</footer>

</body>
</html>
<!-- обновление сайта -->
